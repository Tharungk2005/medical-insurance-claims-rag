name: Multimodal RAG CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install System Dependencies (Tesseract OCR & poppler)
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr libtesseract-dev poppler-utils

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r medical_rag_chatbot/requirements.txt

    - name: Download spaCy Model
      run: |
        python -m spacy download en_core_web_sm

    - name: Run Environment Verification
      run: |
        python medical_rag_chatbot/test_setup.py

    - name: Ingest Sample Multimodal Data
      run: |
        python medical_rag_chatbot/generate_sample_data.py
        python medical_rag_chatbot/ingestion/pipeline.py

    - name: Run Retrieval Benchmark Tests
      run: |
        python medical_rag_chatbot/evaluation/eval_retrieval.py

    - name: Run Regression Guard Check
      run: |
        python medical_rag_chatbot/evaluation/regression_check.py
